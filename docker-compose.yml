services:
  db:
    # official image, runs natively on Apple Silicon. postgis/postgis has no arm64 build;
    # if PostGIS is needed later, use a multi-arch PostGIS image instead.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    # repository root as context: the image also holds pipeline/ and harmonisation/ for POST /api/sync
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
    volumes:
      - ./data:/app/data           # raw CSVs in, harmonised tables out (the sync writes here)
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # on demand: docker compose run --rm pipeline python <script>
  pipeline:
    build: ./pipeline
    profiles: ["pipeline"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
